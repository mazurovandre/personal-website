function validateInput(el){let error='';if(el.value.trim()&&el.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value))error='Введите адрес в формате name@example.com.';if(el.value.trim()&&(el.dataset.key.endsWith('.url'))&&!safeURL(el.value))error='Укажите ссылку http(s) или относительный путь к файлу.';const target=document.getElementById(el.id+'-error');if(target)target.textContent=error;el.setAttribute('aria-invalid',error?'true':'false');return !error}
function status(){const x=document.querySelector('#save-state');if(x)x.innerHTML=icon(dirty()?'cv':'check')+(dirty()?'Есть несохранённые изменения':'Все изменения сохранены');const b=document.querySelector('#save');if(b)b.disabled=!dirty();const a=document.querySelector('#undo');if(a)a.disabled=!dirty()}
function overview(){return `<div class="heading"><div><h1>Контент сайта</h1><p>Всё, что рассказывает о вас. В одном месте.</p></div><span class="badge">${icon('check')} Локальный режим</span></div><div class="overview"><section class="panel"><div class="panel-title"><h2>Разделы сайта</h2><span class="count">5 разделов</span></div>${Object.keys(descriptions).map(k=>`<button class="content-row" data-go="${k}"><span class="row-icon">${icon(k)}</span><span class="row-copy"><strong>${names[k]}</strong><span>${descriptions[k]}</span></span><span class="row-arrow">${icon('arrow')}</span></button>`).join('')}</section><aside class="right-rail"><section class="panel site-card"><div class="od-row"><h3 class="od-fill">Ваш сайт</h3>${icon('external')}</div><div class="mini-site"><div><strong>${esc(draft.home.firstName)}<br>${esc(draft.home.lastName)}</strong><p>${esc(draft.home.role)}</p></div></div><a class="btn" href="portfolio.html" target="_blank" rel="noopener">Открыть исходный сайт ${icon('external')}</a></section><section class="panel note"><h3>Сначала — ваш текст</h3><p>Выберите раздел, внесите изменения и сохраните их. Экспорт JSON поможет перенести контент.</p></section></aside></div><div class="bottom-note">${icon('check')} Исходный сайт сохранён отдельно</div><section class="panel note" style="margin-top:var(--s5)"><div class="od-row"><div class="od-fill od-field"><h3>Данные под вашим контролем</h3><span class="caption">Сброс вернёт тексты исходного сайта. Перед этим можно экспортировать копию.</span></div><button class="btn danger" id="reset">Сбросить</button></div></section>`}
function editor(){const d=draft[current];let fields='';if(current==='home'){fields=`<div class="split">${field('Имя','home.firstName',d.firstName)}${field('Фамилия','home.lastName',d.lastName)}</div>${field('Специализация','home.role',d.role)}<h3>Подписи навигации</h3>${field('Контакты','home.contactsLabel',d.contactsLabel)}${field('Обо мне','home.aboutLabel',d.aboutLabel)}${field('Резюме','home.cvLabel',d.cvLabel)}`;}else if(current==='seo'){fields=field('Заголовок страницы','seo.title',d.title,'text','Название вкладки браузера и страницы в поиске.')+field('Описание страницы','seo.description',d.description,'textarea','Краткое описание содержания для поисковых систем.')}else{fields=field('Заголовок',current+'.title',d.title)+`<h3>Содержание раздела</h3>`+d.paragraphs.map((p,i)=>`<div class="repeat"><div class="repeat-head"><span>Текстовый блок ${i+1}</span><button type="button" class="btn plain danger" data-remove-paragraph="${i}" aria-label="Удалить текстовый блок ${i+1}">Удалить</button></div>${field('Текст',current+'.paragraphs.'+i,p,'textarea')}</div>`).join('')+`<button type="button" class="btn" id="add-paragraph">+ Добавить текстовый блок</button>`;if(current==='contacts')fields+=`<h3>Контактные данные</h3><p class="help">Контакты из текущего сайта. Email и социальные ссылки являются примерами, замените их своими.</p>${field('Email','contacts.email',d.email,'email')}${d.links.map((l,i)=>`<div class="repeat"><div class="repeat-head"><span>Ссылка ${i+1}</span><button type="button" class="btn plain danger" data-remove-link="${i}">Удалить</button></div>${field('Название','contacts.links.'+i+'.label',l.label)}${field('Адрес ссылки','contacts.links.'+i+'.url',l.url)}</div>`).join('')}<button type="button" class="btn" id="add-link">+ Добавить ссылку</button>`;if(current==='cv')fields+=`<h3>Файл резюме</h3><p class="help">На сайте подключён пример PDF. Замените ссылку, когда ваше резюме будет готово.</p>${field('Ссылка на файл','cv.url',d.url,'text','Например: assets/resume.pdf или HTTPS-ссылка.')}${field('Имя файла для скачивания','cv.downloadName',d.downloadName)}`}
const extraLabels={technologies:'Технологии — по одной в строке',stackNote:'Примечание о технологиях',toolkitLabel:'Заголовок списка технологий',formTitle:'Заголовок формы',formNote:'Пояснение формы',action:'Кнопка формы',nameLabel:'Подпись имени',emailLabel:'Подпись email',subjectLabel:'Подпись темы',messageLabel:'Подпись сообщения',label:'Кнопка скачивания',openLabel:'Кнопка открытия PDF',fallback:'Текст при недоступном PDF'};Object.entries(d).forEach(([key,value])=>{if(extraLabels[key])fields+=field(extraLabels[key],current+'.'+key,value,key==='technologies'||key==='formNote'?'textarea':'text')});return `<div class="heading"><div><h1>${names[current]}</h1><p>${descriptions[current]}. Измените нужные поля.</p></div><span class="badge">Редактор контента</span></div><div class="editor-layout"><form class="panel" id="editor" novalidate><div class="panel-title"><h2>Содержание</h2><span class="count">EN</span></div><div id="form-errors" class="alert error" hidden></div><div class="form-body">${fields}</div><div class="editor-foot"><span class="status" id="save-state"></span><div class="action-row"><button type="button" class="btn" id="undo">Отменить</button><button type="submit" class="btn primary" id="save">Сохранить</button></div></div></form><aside class="panel preview"><div class="preview-head">Текущий контент</div><div id="preview"></div></aside></div>`}
function preview(){const root=document.querySelector('#preview');if(!root)return;const d=draft[current];if(current==='home'){root.innerHTML=`<h3>${esc(d.firstName)} ${esc(d.lastName)}</h3><p>${esc(d.role)}</p><p>${esc(d.contactsLabel)} · ${esc(d.aboutLabel)} · ${esc(d.cvLabel)}</p>`}else if(current==='seo'){root.innerHTML=`<h3>${esc(d.title)}</h3><p>${esc(d.description)}</p>`}else{root.innerHTML=`<h3>${esc(d.title)}</h3>${d.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}`;if(current==='about')root.innerHTML+=`<h3>${esc(d.toolkitLabel)}</h3><p>${esc(d.technologies)}</p><p>${esc(d.stackNote)}</p>`;if(current==='contacts'){root.innerHTML+=`<h3>${esc(d.formTitle)}</h3><p>${esc(d.formNote)}</p><p>${esc(d.action)}</p>`;root.innerHTML+=d.email?`<p>${esc(d.email)}</p>`:'<p class="help">Email ещё не указан</p>';d.links.forEach(l=>root.innerHTML+=safeURL(l.url)?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)} ${icon('external')}</a>`:`<p>${esc(l.label)} · ${esc(l.url)}</p>`)}if(current==='cv')root.innerHTML+=d.url&&safeURL(d.url)?`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.downloadName||'Открыть CV')} ${icon('external')}</a>`:'<p class="help">Файл резюме пока не добавлен</p>'}}
function render(){document.querySelector('#nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="nav-btn ${k===current?'active':''}" data-go="${k}" ${k===current?'aria-current="page"':''}>${icon(k)}${v}</button>`).join('');document.querySelector('#crumb').textContent=names[current];document.querySelector('#view').innerHTML=current==='overview'?overview():editor();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go);document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('input',()=>{setValue(el.dataset.key,el.value);status();preview()});el.addEventListener('blur',()=>validateInput(el))});document.querySelector('#editor')?.addEventListener('submit',save);document.querySelector('#undo')?.addEventListener('click',()=>confirmIt('Отменить изменения?','Несохранённые изменения во всех разделах будут отменены.',()=>{draft=clone(saved);render();toast('Изменения отменены')}));document.querySelector('#reset')?.addEventListener('click',()=>confirmIt('Вернуть исходный контент?','Все локальные изменения будут заменены текстами исходного сайта. Экспортируйте копию, если хотите сохранить текущую версию.',()=>{try{localStorage.setItem(KEY,JSON.stringify(INITIAL));saved=clone(INITIAL);draft=clone(INITIAL);render();toast('Исходный контент восстановлен')}catch{notice('Не удалось выполнить сброс: хранилище недоступно.',true)}}));document.querySelector('#add-paragraph')?.addEventListener('click',()=>{draft[current].paragraphs.push('');render()});document.querySelector('#add-link')?.addEventListener('click',()=>{draft.contacts.links.push({label:'',url:''});render()});document.querySelectorAll('[data-remove-paragraph]').forEach(b=>b.onclick=()=>confirmIt('Удалить текстовый блок?','Блок исчезнет из текущей версии контента. Изменение потребуется сохранить.',()=>{draft[current].paragraphs.splice(Number(b.dataset.removeParagraph),1);render()}));document.querySelectorAll('[data-remove-link]').forEach(b=>b.onclick=()=>confirmIt('Удалить ссылку?','Ссылка исчезнет из текущей версии контактов.',()=>{draft.contacts.links.splice(Number(b.dataset.removeLink),1);render()}));preview();status()}
function save(e){e.preventDefault();const errors=[...document.querySelectorAll('[data-key]')].filter(el=>!validateInput(el));const box=document.querySelector('#form-errors');box.hidden=!errors.length;if(errors.length){box.innerHTML='Исправьте поля: '+errors.map(el=>`<a href="#${el.id}" data-error-focus="${el.id}">${esc(document.querySelector(`label[for="${el.id}"]`).textContent)}</a>`).join(', ');box.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.errorFocus).focus()});errors[0].focus();return}const b=document.querySelector('#save');b.disabled=true;b.textContent='Сохранение…';setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(draft));saved=clone(draft);notice('');toast('Контент сохранён в этом браузере')}catch{notice('Не удалось сохранить в браузере. Экспортируйте JSON, чтобы не потерять изменения.',true)}b.textContent='Сохранить';status()},200)}
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(draft,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mazurov-content.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Экспортирована текущая версия контента')};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2*1024*1024)throw Error('Выберите JSON размером до 2 МБ.');const x=JSON.parse(await f.text());if(!valid(x))throw Error('Структура не подходит. Используйте JSON, экспортированный из этой админки.');confirmIt('Импортировать контент?','Все текущие поля будут заменены содержимым файла. После импорта сохраните изменения.',()=>{draft=clone(x);render();notice('Импорт выполнен. Сохраните изменения в любом разделе.');toast('Контент импортирован')})}catch(err){notice(err instanceof SyntaxError?'Файл не является корректным JSON. Выберите экспортированный файл.':err.message,true)}e.target.value=''};
function route(){const key=location.hash.slice(1);current=Object.hasOwn(names,key)?key:'overview';render()}window.addEventListener('hashchange',route);window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});route();if(storageIssue)notice(storageIssue,true);
</script></body></html>
