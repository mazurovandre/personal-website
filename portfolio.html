<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack { display:flex; flex-direction:column; gap:var(--od-gap,8px); }
  .od-row { display:flex; align-items:center; gap:var(--od-gap,8px); }
  .od-row-top { display:flex; align-items:flex-start; gap:var(--od-gap,8px); }
  .od-cluster { display:flex; flex-wrap:wrap; align-items:center; gap:var(--od-gap,8px); }
  .od-fill { flex:1 1 0; min-width:0; }
  .od-fixed { flex:none; }
  .od-grid { display:grid; gap:var(--od-gap,12px); grid-template-columns:repeat(var(--od-cols,3),minmax(0,1fr)); }
  .od-stat,.od-field,.od-cell { display:grid; gap:var(--od-gap,2px); }
  :where(.od-stat,.od-field,.od-cell)>:where(*) { display:block; }
  .od-tile { display:grid; grid-template-rows:auto 1fr; }
  :where(.od-tile)>:where(*) { display:block; }
  .od-media { display:block; width:100%; height:auto; aspect-ratio:var(--od-ratio,auto); }
  .od-media-cover { object-fit:cover; }
  .od-truncate { display:block; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .od-clamp-2,.od-clamp-3 { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .od-clamp-2 { -webkit-line-clamp:2; }
  .od-clamp-3 { -webkit-line-clamp:3; }
  .od-lines-2 { min-height:calc(2 * 1.4em); }
  .od-nowrap { white-space:nowrap; }
  .od-keep { word-break:keep-all; overflow-wrap:anywhere; }
  .od-screen { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; }
  .od-scroll { overflow-y:auto; overscroll-behavior:contain; min-height:0; }
  .od-rail { display:flex; gap:var(--od-gap,8px); overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; padding-inline:var(--od-rail-pad,16px); scroll-padding-inline:var(--od-rail-pad,16px); }
  .od-rail::-webkit-scrollbar { display:none; }
  :where(.od-rail)>:where(*) { flex:none; scroll-snap-align:start; }
  :where(.od-rail)>:where(:last-child) { margin-inline-end:var(--od-rail-pad,16px); }
  .od-spacer { flex:none; visibility:hidden; pointer-events:none; }
  .od-touch { min-width:44px; min-height:44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */
@font-face { font-family:'Bodoni Moda'; src:url('assets/fonts/BodoniModa.ttf') format('truetype'); font-style:normal; font-weight:400 900; font-display:swap; }
@font-face { font-family:'Jost'; src:url('assets/fonts/Jost.ttf') format('truetype'); font-style:normal; font-weight:100 900; font-display:swap; }
:root {
  color-scheme:light;
  --bg:#F8F9F6; --surface:#FFFFFF; --text:#232522; --muted:#555B54; --accent:#303B30; --border:#70796D;
  --display:'Bodoni Moda',Didot,Georgia,serif; --body:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --label-font:'Jost',system-ui,sans-serif; --label-tracking:.12em; --label-weight:500;
  --scrim:rgb(35 37 34 / .32);
  --name:clamp(48px,8vw,128px); --role:clamp(16px,2vw,24px); --body-size:16px;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s6:48px; --s8:64px;
  --dialog-width:880px; --cv-width:960px; --brand-icon:20px; --perimeter:64px; --radius:8px; --enter:180ms; --exit:120ms;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:var(--body-size)/1.6 var(--body); }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible { outline:2px solid var(--accent); outline-offset:8px; border-radius:2px; }
.portfolio { min-height:100svh; display:grid; grid-template-rows:auto 1fr auto; padding:var(--perimeter); padding-top:max(var(--perimeter),env(safe-area-inset-top)); padding-bottom:max(var(--perimeter),env(safe-area-inset-bottom)); gap:var(--s4); }
.top { display:flex; justify-content:flex-end; align-items:center; }
.text-link { display:flex; align-items:center; min-height:44px; padding:var(--s1) 0; background:none; border:0; position:relative; font-family:var(--label-font); font-weight:var(--label-weight); letter-spacing:var(--label-tracking); text-transform:uppercase; white-space:nowrap; }
.text-link::after { content:''; position:absolute; bottom:var(--s1); left:0; height:1px; width:100%; background:currentColor; transform:scaleX(0); transform-origin:left; transition:transform var(--enter) ease-out; }
.text-link:focus-visible::after { transform:scaleX(1); }
.identity { align-self:center; text-align:center; --od-gap:var(--s4); padding-block:var(--s4); }
.identity h1, .dialog-title { margin:0; font-family:var(--display); font-weight:400; line-height:1.05; font-optical-sizing:auto; letter-spacing:-.045em; text-transform:uppercase; }
.identity h1 { font-size:var(--name); }
.dialog-title { font-size:clamp(32px,5vw,48px); overflow-wrap:anywhere; }
.identity h1 span { display:block; }
.identity .surname { color:var(--text); font-style:normal; }
.identity p { margin:0; font-family:var(--label-font); font-size:var(--role); font-weight:var(--label-weight); letter-spacing:var(--label-tracking); text-transform:uppercase; color:var(--muted); text-wrap:balance; }
.bottom { display:flex; align-items:center; justify-content:space-between; gap:var(--s3); }
dialog { width:min(var(--dialog-width),calc(100% - 48px)); max-height:calc(100svh - 48px); padding:var(--s4); background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:var(--radius); overflow-y:auto; overscroll-behavior:contain; }
dialog::backdrop { background:var(--scrim); }
dialog[open] { animation:appear var(--enter) ease-out; }
.dialog-top { align-items:flex-start; justify-content:space-between; --od-gap:var(--s3); margin-bottom:var(--s4); }
.eyebrow { font-size:var(--body-size); color:var(--accent); margin:0; }
.close { display:flex; justify-content:center; align-items:center; width:44px; height:44px; padding:0; background:transparent; border:1px solid var(--border); border-radius:50%; transition:background var(--enter) ease-out; }
.close svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; }
.dialog-copy { --od-gap:var(--s3); }

.dialog-copy p { margin:0; color:var(--muted); }
.dialog-copy .role { color:var(--text); }
.detail-note { padding-top:var(--s3); border-top:1px solid var(--border); }
@media (hover:hover) { .text-link:hover { color:var(--accent); } .text-link:hover::after { transform:scaleX(1); } .close:hover { background:var(--bg); } }
@keyframes appear { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@media (min-width:1440px) { .identity { --od-gap:var(--s6); } }
@media (max-width:1023px) { :root { --perimeter:48px; --name:clamp(64px,11vw,112px); } }
@media (max-width:767px) { :root { --perimeter:24px; --name:clamp(48px,11vw,80px); } .identity { --od-gap:var(--s3); } .identity p { max-width:24ch; align-self:center; } dialog { padding:var(--s3); } }
@media (max-width:374px) { :root { --perimeter:16px; --name:clamp(32px,11vw,40px); } .bottom { gap:var(--s2); } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }

:root { --error:#A12622; }
dialog a { color:var(--accent); text-underline-offset:4px; }
dialog a:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
.tech-list { list-style:none; margin:0; padding:0; --od-gap:8px; }
.tech-list li { border:1px solid var(--border); padding:8px 12px; font-family:var(--label-font); }
.social-links { --od-gap:24px; }
.social-links a { display:flex; align-items:center; min-height:44px; font-family:var(--label-font); }
.email-link { overflow-wrap:anywhere; }
.contact-form { --od-gap:16px; padding-top:24px; border-top:1px solid var(--border); }
.contact-form h3, .stack-title { margin:0; font:500 20px/1.5 var(--label-font); }
.contact-form label { display:block; font-weight:500; }
.contact-form .od-field { --od-gap:8px; }
.contact-form input, .contact-form textarea { display:block; width:100%; min-width:0; padding:12px; border:1px solid var(--border); border-radius:4px; color:var(--text); background:var(--surface); font:inherit; }
.contact-form textarea { min-height:128px; resize:vertical; }
.contact-form [aria-invalid="true"] { border-color:var(--error); }
.contact-form .field-error, .contact-form .error-summary { color:var(--error); }
[hidden] { display:none!important; }
.primary-action { display:inline-flex; min-height:44px; padding:12px 24px; align-items:center; justify-content:center; width:fit-content; border:1px solid var(--text); background:var(--text); color:var(--surface); font:500 16px/1.5 var(--label-font); text-decoration:none; border-radius:4px; }
#cv { width:min(var(--cv-width),calc(100% - 48px)); }
.pdf-view { display:block; width:100%; aspect-ratio:595 / 842; border:1px solid var(--border); background:var(--bg); }
.cv-actions { --od-gap:24px; }
.cv-actions .primary-action { color:var(--surface); }
@media (hover:hover) { dialog a:hover { text-decoration-thickness:2px; } .primary-action:hover { background:var(--accent); } }


/* Monochrome brand marks continue the portfolio palette. */
.brand-icons { display:inline-flex; align-items:center; gap:var(--s1); flex:none; color:var(--accent); }
.brand-icons svg { display:block; width:var(--brand-icon); height:var(--brand-icon); aspect-ratio:1; fill:currentColor; }
.tech-list li { display:flex; align-items:center; gap:var(--s1); min-height:44px; color:var(--accent); }
.social-links a { gap:var(--s1); }
.dialog-copy p { max-width:75ch; }
@media (min-width:768px) {
  .contact-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2); }
  .contact-form > :not(.od-field), .contact-form > .od-field:has(textarea) { grid-column:1 / -1; }
}
@media (max-width:767px) {
  dialog, #cv { width:calc(100% - 32px); max-height:calc(100svh - 32px); }
  .social-links { --od-gap:16px; }
}


#contacts .contact-form { display:flex; flex-direction:column; gap:var(--s2); }
#contacts .contact-address { display:block; width:fit-content; max-width:100%; margin-bottom:var(--s1); font:500 clamp(20px,3vw,24px)/1.5 var(--label-font); }
#contacts .social-links { --od-gap:24px; }
</style>
</head>

<script>
(() => {

  const triggers = new WeakMap();
  document.querySelectorAll('[data-dialog]').forEach(button => {
    button.addEventListener('click', () => {
      const dialog = document.getElementById(button.dataset.dialog);
      triggers.set(dialog, button);
      dialog.showModal();
    });
  });
  document.querySelectorAll('dialog').forEach(dialog => {
    dialog.querySelector('.close').addEventListener('click', () => dialog.close());
    let backdropPress = false;
    const outside = event => {
      const bounds = dialog.getBoundingClientRect();
      return event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom;
    };
    dialog.addEventListener('pointerdown', event => { backdropPress = event.target === dialog && outside(event); });
    dialog.addEventListener('click', event => {
      if (backdropPress && event.target === dialog && outside(event)) dialog.close();
      backdropPress = false;
    });
    dialog.addEventListener('keydown', event => {
      if (event.key !== 'Tab') return;
      const controls = [...dialog.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(node => !node.disabled);
      const first = controls[0], last = controls[controls.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }

    });
    dialog.addEventListener('close', () => triggers.get(dialog)?.focus({preventScroll:true}));

    const subject = String(data.get('subject')).replace(/[\r\n]/g,' ').trim();
    const body = String(data.get('message')).trim();
    const url = 'mailto:' + content.contacts.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    status.textContent = 'Finish sending in your email app. If it did not open, use the email link above.'; status.hidden = false;
    window.location.href = url;
  });


})();
</script>
