services:
  web:
    image: ${WEB_IMAGE:-personal-website-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      CONTENT_DIR: /content/active
    volumes:
      - /srv/personal-website/content:/content:ro
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ${API_IMAGE:-personal-website-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 3001
    ports:
      - 127.0.0.1:3001:3001
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

